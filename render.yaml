services:
  - type: web
    name: audio-agent-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ORIGIN
        value: https://audio-agent-frontend-qez7.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://audio-agent-frontend-qez7.onrender.com

  - type: web
    name: audio-agent-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_URL
        value: https://audio-agent-backend-0xmq.onrender.com
